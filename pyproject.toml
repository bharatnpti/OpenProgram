[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openprogram"
version = "0.1.0"
description = "Agentic program-management foundation service"
readme = "prd.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "cryptography>=42.0.0",
    "dbos>=2.24.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "prometheus-client>=0.20.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.30",
    "structlog>=24.2.0",
    "temporalio>=1.6.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.0",
    "mypy>=1.10.0",
    "playwright>=1.45.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.2.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "testcontainers[postgres,redis]>=4.7.0",
]

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--cov=backend/core --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: docker-backed integration tests",
    "ui_bdd: playwright-backed frontend BDD scenarios (require browsers + dev servers)",
]

[tool.coverage.run]
source = ["backend/core"]
branch = true
omit = ["backend/core/ports/*", "backend/core/__init__.py", "backend/core/**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C901", "UP", "ASYNC", "ANN"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["ANN201"]
"backend/infra/persistence/migrations/**/*.py" = ["ANN201"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
strict = true
warn_unused_ignores = true
warn_return_any = true
packages = ["api", "config", "core", "infra"]
exclude = ["backend/infra/persistence/migrations/.*"]

[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "dbos.*",
    "temporalio.*",
    "langgraph.*",
]
ignore_missing_imports = true
