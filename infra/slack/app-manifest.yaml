# Slack app for OpenProgram check-ins.
#
# api.slack.com/apps -> Create New App -> From a manifest -> paste this file.
# Scopes are the ones the adapters call:
#   users:read, users:read.email  directory sync (users.list, with email for identity matching)
#   im:write                      conversations.open, to start the DM
#   chat:write                    chat.postMessage, the check-in question
#   im:history                    conversations.history and the message.im event, the reply
#
# Event subscriptions are added once the backend is reachable over HTTPS, because
# Slack verifies the Request URL when it is saved:
#   Event Subscriptions -> Request URL https://<tunnel>/webhooks/chat/slack
#   Subscribe to bot events -> message.im
display_information:
  name: OpenProgram
  description: Daily delivery check-ins
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: OpenProgram
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - im:history
      - users:read
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
