name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: PYTHONPATH=backend uv run mypy
      - run: PYTHONPATH=backend uv run lint-imports
      - run: PYTHONPATH=backend uv run pytest

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - run: OPENPROGRAM_RUN_INTEGRATION=1 PYTHONPATH=backend uv run pytest backend/tests/integration -m integration --no-cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

  frontend-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-v2/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: frontend-v2
      # Same target as `make verify`: regenerates the schema and both clients,
      # then fails if any of them differ from what is committed.
      - run: make openapi-check

  image:
    runs-on: ubuntu-latest
    needs: [backend, integration, frontend, frontend-v2, api-contract]
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/openprogram-backend:${GITHUB_SHA}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
      - run: docker build -f backend/Dockerfile -t "${{ steps.meta.outputs.image }}" .
      - if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image }}"
